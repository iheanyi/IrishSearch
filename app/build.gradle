plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Supply credentials through the build environment; never commit a keystore or password.
def releaseSecrets = ['IRISHSEARCH_KEYSTORE', 'IRISHSEARCH_KEYSTORE_PASSWORD',
    'IRISHSEARCH_KEY_ALIAS', 'IRISHSEARCH_KEY_PASSWORD'].collectEntries { name ->
    [(name): providers.environmentVariable(name).orNull]
}
if (releaseSecrets.values().any { it != null } && !releaseSecrets.values().every { it }) {
    throw new GradleException('Provide all four IRISHSEARCH signing environment variables, or leave all unset.')
}

android {
    namespace 'com.iheanyiekechukwu.irishsearch'
    compileSdk 37

    defaultConfig {
        applicationId 'com.iheanyi.notredame.classsearch'
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName '3.0'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    if (releaseSecrets.values().every { it }) {
        signingConfigs {
            release {
                storeFile file(releaseSecrets.IRISHSEARCH_KEYSTORE)
                storePassword releaseSecrets.IRISHSEARCH_KEYSTORE_PASSWORD
                keyAlias releaseSecrets.IRISHSEARCH_KEY_ALIAS
                keyPassword releaseSecrets.IRISHSEARCH_KEY_PASSWORD
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
